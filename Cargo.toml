[package]
name = "stableflow"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8" }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
leptos_axum = { version = "0.8", optional = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SSR-only deps
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "io-util"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }
axum-extra = { version = "0.10", features = ["cookie"], optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"], optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
image = { version = "0.25", optional = true }
base64 = { version = "0.22", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
bcrypt = { version = "0.15", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
futures = { version = "0.3", optional = true }
time = { version = "0.3", optional = true }

# hydrate-only deps
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "=0.2.122", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Window", "Document", "Element", "HtmlElement", "CssStyleDeclaration",
    "HtmlCanvasElement", "CanvasRenderingContext2d",
    "HtmlImageElement", "PointerEvent", "MouseEvent", "Event",
    "DomRect", "ImageData", "Blob", "Url",
] }

[features]
default = []
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:leptos_axum",
    "dep:axum",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:axum-extra",
    "dep:sqlx",
    "dep:reqwest",
    "dep:image",
    "dep:base64",
    "dep:zip",
    "dep:uuid",
    "dep:bcrypt",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:futures",
    "dep:time",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[package.metadata.leptos]
output-name = "stableflow"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.scss"
assets-dir = "public"
site-addr = "0.0.0.0:3000"
reload-port = 3001
browserquery = "defaults"
watch = false
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
